name: Verify complete k6 factoring theorem

on:
  push:
    paths:
      - 'variants/k6/FactoringK6/**'
      - 'variants/k6/reference.patch'
      - 'tools/check_k6.sh'
      - 'tools/check_k6_receipt.py'
      - 'upstream.lock.json'
      - '.github/workflows/verify-k6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k6-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certified-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Lean release
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            --output "$RUNNER_TEMP/lean.tar.zst"
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Build the modified program and certify its complete rate
        run: bash tools/check_k6.sh
