name: Clean integrated branches

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible branches (unchecked previews only)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-integrated-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Clean old integrated remote branches
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python3 tools/cleanup_branches.py "${args[@]}"
